[package]
name = "ash-fsm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A configurable finite state machine library for Rust, inspired by AshStateMachine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ashforge-rs/ash-fsm"
documentation = "https://docs.rs/ash-fsm"
homepage = "https://github.com/ashforge-rs/ash-fsm"
keywords = ["state-machine", "fsm", "finite-state-machine", "state", "ash"]
categories = ["data-structures", "rust-patterns"]
authors = []
readme = "README.md"
exclude = []

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]
async = ["dep:tokio"]

[dependencies]
thiserror = "2"
ash-time = "1"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

